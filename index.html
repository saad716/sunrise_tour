<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sunrise Tours — Live Support Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --c1: #2B2E48;
    --c2: #494e6c;
    --accent: #F2994A;
    --accent2: #F6C453;
    --accent-tint: #FFF3E4;
    --ink: #24263A;
    --muted: #7B7E96;
    --surface: #FBFAF8;
  }

  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

  /* ══════════ LAUNCHER — independent fixed element, same pattern
     used successfully on the Bot Yama widget ══════════ */
  .launcher-wrap {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 2147483000;
  }
  .live-pill {
    background: #fff; border: 1px solid #ECE8DE; border-radius: 30px;
    padding: 9px 16px 9px 12px; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 24px rgba(28,27,42,0.14);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    animation: pillIn 0.4s cubic-bezier(.2,.9,.3,1.2) 0.6s both;
  }
  .live-pill-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #4CBB56; flex-shrink: 0;
    animation: liveDot 2s infinite;
  }
  .live-pill-text { display: flex; flex-direction: column; line-height: 1.25; }
  .live-pill-title { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .live-pill-sub { font-size: 10.5px; color: var(--muted); font-weight: 500; }
  @keyframes pillIn { from { opacity: 0; transform: translateX(8px) scale(0.94); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes liveDot { 0% { box-shadow: 0 0 0 0 rgba(76,187,86,0.55); } 70% { box-shadow: 0 0 0 7px rgba(76,187,86,0); } 100% { box-shadow: 0 0 0 0 rgba(76,187,86,0); } }

  .launcher-btn {
    position: relative; width: 62px; height: 62px; border-radius: 50%;
    border: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 26px rgba(242,153,74,0.45), 0 2px 8px rgba(28,27,42,0.18);
    animation: buzz 3.2s ease-in-out infinite;
  }
  .launcher-btn svg { width: 30px; height: 30px; pointer-events: none; }
  .launcher-btn::before, .launcher-btn::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid rgba(242,153,74,0.55);
    animation: ripple 2.6s ease-out infinite;
    pointer-events: none;
  }
  .launcher-btn::after { animation-delay: 1.3s; }
  @keyframes ripple { 0% { transform: scale(1); opacity: 0.65; } 100% { transform: scale(1.7); opacity: 0; } }
  @keyframes buzz {
    0%, 78%, 100% { transform: rotate(0deg) scale(1); }
    80%  { transform: rotate(-8deg) scale(1.04); }
    83%  { transform: rotate(7deg) scale(1.04); }
    86%  { transform: rotate(-5deg) scale(1.02); }
    89%  { transform: rotate(4deg) scale(1.02); }
    92%  { transform: rotate(0deg) scale(1); }
  }
  .launcher-badge {
    position: absolute; top: -3px; right: -3px;
    width: 19px; height: 19px; border-radius: 50%;
    background: #E4453C; color: #fff; font-size: 10px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #F3F2EE; z-index: 2; pointer-events: none;
  }
  .launcher-wrap.hidden { display: none; }

  /* ══════════ CHAT PANEL — its own INDEPENDENT fixed element,
     not nested inside the launcher's container ══════════ */
  .chat-container {
    position: fixed;
    bottom: 96px; right: 20px;
    width: 380px; height: 640px; max-height: calc(100vh - 116px);
    background: var(--surface);
    border-radius: 18px;
    box-shadow: 0 20px 56px rgba(28,27,42,0.28), 0 4px 14px rgba(28,27,42,0.14);
    display: none;
    flex-direction: column;
    z-index: 2147483647;
    overflow: hidden;
    isolation: isolate;
  }
  .chat-container.active { display: flex; animation: scaleIn 0.3s ease-out; }
  @keyframes scaleIn { from { transform: scale(0.92) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }

  @media (max-width: 480px) {
    .launcher-wrap { right: 12px; bottom: 12px; }
    .chat-container {
      width: 100vw; height: 100vh; height: 100dvh;
      bottom: 0; right: 0; top: 0; left: 0;
      border-radius: 0;
      position: fixed; z-index: 2147483647;
    }
    .chat-container.active ~ .launcher-wrap,
    body.chat-open .launcher-wrap { display: none; }
  }

  /* ─── HEADER ─── */
  .hdr {
    background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%);
    padding: 16px 16px 14px;
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0; position: relative; overflow: hidden;
  }
  .hdr::after {
    content: ''; position: absolute; right: -30px; top: -30px;
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle, rgba(242,153,74,0.35), rgba(242,153,74,0) 70%);
  }
  .hdr-av {
    width: 42px; height: 42px; border-radius: 50%;
    overflow: hidden; flex-shrink: 0;
    border: 2px solid rgba(242,153,74,0.6);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .hdr-av svg { width: 22px; height: 22px; }
  .hdr-info { flex: 1; min-width: 0; z-index: 1; }
  .hdr-name {
    font-size: 15.5px; font-weight: 800; color: #fff; letter-spacing: -0.01em; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hdr-agent-row { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
  .hdr-agent-label { font-size: 10px; font-weight: 700; color: var(--accent2); letter-spacing: 0.07em; text-transform: uppercase; }
  .agent-badge {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22);
    color: #fff; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px;
    letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; gap: 3px;
  }
  .agent-badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #7CC576; display: inline-block; }
  .hdr-close {
    background: rgba(255,255,255,0.1); border: none; color: rgba(255,255,255,0.7);
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; z-index: 1;
    -webkit-tap-highlight-color: transparent;
  }
  .hdr-close:hover { background: rgba(255,255,255,0.2); }

  /* ─── SUBHEADER TRUST BAR ─── */
  .subhdr {
    background: #fff; border-bottom: 1px solid #ECE8DE;
    padding: 7px 16px; display: flex; align-items: center; gap: 10px;
    flex-shrink: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .subhdr::-webkit-scrollbar { display: none; }
  .sub-item {
    display: flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--muted); font-weight: 600;
    white-space: nowrap; flex-shrink: 0; padding-right: 12px;
  }
  .sub-item:not(:last-child) { border-right: 1px solid #E9E5D9; margin-right: 2px; }
  .sub-item.star { color: var(--accent); }

  /* ─── MESSAGES ─── */
  .msgs {
    flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 14px;
    overscroll-behavior: contain; background: var(--surface); min-height: 0;
  }
  .msgs::-webkit-scrollbar { width: 4px; }
  .msgs::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }

  .date-pill { text-align: center; font-size: 11px; color: var(--muted); font-weight: 500; padding: 2px 0 4px; }

  .agent-row { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .agent-row-av {
    width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    display: flex; align-items: center; justify-content: center;
  }
  .agent-row-av svg { width: 15px; height: 15px; }
  .agent-row-name { font-size: 11.5px; font-weight: 700; color: var(--ink); letter-spacing: 0.01em; }
  .agent-row-badge {
    font-size: 9px; font-weight: 700; color: var(--c2); background: var(--accent-tint);
    padding: 1px 6px; border-radius: 10px; letter-spacing: 0.05em; text-transform: uppercase;
    display: flex; align-items: center; gap: 3px;
  }
  .agent-row-badge svg { width: 9px; height: 9px; }
  .agent-row-time { font-size: 10px; color: var(--muted); margin-left: auto; }

  .msg-group { animation: fadeUp 0.22s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg { display: flex; gap: 8px; margin-bottom: 4px; }
  .msg.u { flex-direction: row-reverse; }

  .u-av {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent-tint); color: var(--c2); font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; align-self: flex-end;
  }

  .bub { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.65; word-break: break-word; }
  .bub.b { background: #F2EFE6; color: var(--ink); border-top-left-radius: 4px; }
  .bub.u { background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; border-top-right-radius: 4px; }

  .bub.b strong { color: var(--c2); font-weight: 700; }
  .bub.b em { font-style: italic; color: var(--muted); }
  .bub.b ul, .bub.b ol { margin: 6px 0 4px 18px; }
  .bub.b li { margin-bottom: 4px; line-height: 1.55; }
  .bub.b p { margin-bottom: 6px; }
  .bub.b p:last-child { margin-bottom: 0; }
  .bub.b h3 { font-size: 14px; font-weight: 700; color: var(--ink); margin: 7px 0 4px; }
  .bub.b a { color: var(--c2); text-decoration: underline; word-break: break-all; }
  .bub.b code { background: #E9E4D5; color: var(--ink); border-radius: 4px; padding: 1px 5px; font-size: 12px; font-family: monospace; }
  .bub.b blockquote { border-left: 3px solid var(--accent); padding-left: 10px; margin: 6px 0; color: var(--muted); font-style: italic; }
  .bub.b hr { border: none; border-top: 1px solid #E9E5D9; margin: 8px 0; }

  .options-wrap { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 7px; animation: fadeUp 0.25s ease 0.1s both; }
  .opt-pill {
    background: #fff; border: 1.5px solid var(--accent); color: var(--c2);
    font-size: 13px; font-weight: 500; padding: 7px 15px; border-radius: 50px;
    cursor: pointer; transition: all 0.16s; -webkit-tap-highlight-color: transparent;
    white-space: normal; text-align: center; line-height: 1.35; font-family: 'Inter', sans-serif;
  }
  .opt-pill:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .opt-pill:active { transform: scale(0.97); }
  .opt-pill:disabled { opacity: 0.45; cursor: not-allowed; border-color: #D6D2C4; color: #B9B6A8; }

  .tdots { display: flex; gap: 4px; align-items: center; padding: 11px 16px; background: #F2EFE6; border-radius: 18px; border-top-left-radius: 4px; width: fit-content; }
  .d { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; opacity: 0.7; animation: bop 1.2s infinite; }
  .d:nth-child(2) { animation-delay: .2s; }
  .d:nth-child(3) { animation-delay: .4s; }
  @keyframes bop { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  .bub.err { background: #FBE8E6; color: #A6362C; border-top-left-radius: 4px; }
  .retry-btn {
    display: inline-block; margin-top: 6px; background: #fff; border: 1px solid #E5AFA8;
    color: #A6362C; font-size: 12px; padding: 4px 10px; border-radius: 12px; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: background 0.15s;
  }
  .retry-btn:hover { background: #A6362C; color: #fff; }

  /* ─── TOUR CARDS ─── */
  .tour-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 8px; margin-top: 2px; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
  .tour-scroll::-webkit-scrollbar { height: 4px; }
  .tour-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }
  .tour-card {
    flex: 0 0 218px; scroll-snap-align: start; background: #fff; border: 1px solid #ECE8DE; border-radius: 14px;
    overflow: hidden; box-shadow: 0 2px 14px rgba(36,38,58,0.09); display: flex; flex-direction: column;
  }
  .tour-img-wrap { position: relative; width: 100%; height: 122px; background: #DCDDE8; overflow: hidden; }
  .tour-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tour-badge {
    position: absolute; top: 8px; left: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.02em; padding: 4px 9px; border-radius: 20px;
    font-family: 'Inter', sans-serif; box-shadow: 0 2px 6px rgba(242,153,74,0.35);
  }
  .tour-from-badge {
    position: absolute; top: 8px; right: 8px; background: rgba(36,38,58,0.72); color: #fff;
    font-size: 9.5px; font-weight: 600; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.02em;
  }
  .tour-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .tour-title { font-size: 13.5px; font-weight: 700; color: var(--ink); line-height: 1.3; min-height: 35px; }
  .tour-price { font-size: 17px; font-weight: 800; color: var(--accent); line-height: 1.2; margin-top: 1px; }
  .tour-price span { font-size: 10.5px; font-weight: 500; color: var(--muted); }
  .tour-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 7px; }
  .tour-btn { width: 100%; font-size: 12.5px; font-weight: 700; padding: 8px 10px; border-radius: 9px; cursor: pointer; transition: all 0.16s; font-family: 'Inter', sans-serif; }
  .tour-btn.details { background: #fff; border: 1.5px solid #E3DFD1; color: var(--ink); }
  .tour-btn.details:hover { border-color: var(--c2); background: var(--accent-tint); }
  .tour-btn.book { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 1.5px solid transparent; color: #fff; }
  .tour-btn.book:hover { opacity: 0.9; }

  /* ─── TOUR DETAIL POPUP ─── */
  .tour-modal-overlay {
    position: absolute; inset: 0; background: rgba(36,38,58,0.55);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 40; animation: fadeUp 0.18s ease;
  }
  .tour-modal { background: #fff; border-radius: 16px; width: 100%; max-width: 290px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  .tour-modal-img { width: 100%; height: 145px; background: #DCDDE8; object-fit: cover; display: block; }
  .tour-modal-body { padding: 16px 18px 18px; }
  .tour-modal-title { font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
  .tour-modal-desc { font-size: 12px; color: var(--muted); line-height: 1.55; margin-bottom: 10px; }
  .tour-modal-price { font-size: 19px; font-weight: 800; color: var(--accent); margin-bottom: 8px; }
  .tour-modal-price span { font-size: 11px; font-weight: 500; color: var(--muted); }
  .tour-modal-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink); font-weight: 600; padding: 10px 0; border-top: 1px solid #EFEBE0; }
  .tour-modal-meta span { background: var(--accent-tint); color: var(--c2); padding: 4px 9px; border-radius: 20px; }
  .tour-modal-book {
    width: 100%; margin-top: 10px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 700;
    font-family: 'Inter', sans-serif; cursor: pointer; transition: opacity 0.18s;
  }
  .tour-modal-book:hover { opacity: 0.9; }
  .tour-modal-close {
    position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(36,38,58,0.6); border: none; color: #fff; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .tour-modal-img-wrap { position: relative; }

  /* ─── BOOKING CARD ─── */
  .card-wrap { max-width: 94%; animation: fadeUp 0.32s ease; }
  .card { background: #fff; border: 1px solid #ECE8DE; border-radius: 16px; border-top-left-radius: 4px; overflow: hidden; box-shadow: 0 2px 16px rgba(36,38,58,0.1); }
  .card-hdr { background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%); padding: 14px 16px 12px; }
  .card-hdr-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 2px; }
  .card-hdr-sub { font-size: 10.5px; color: rgba(255,255,255,0.62); font-weight: 400; }
  .card-fields { padding: 14px 14px 0; display: flex; flex-direction: column; gap: 8px; }
  .ck-input, .ck-select {
    width: 100%; padding: 10px 13px; border: 1.5px solid #E3DFD1; border-radius: 10px;
    font-family: 'Inter', sans-serif; font-size: 14px; color: var(--ink); background: #FBFAF8;
    outline: none; transition: border-color 0.18s, box-shadow 0.18s;
  }
  .ck-select { appearance: none; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237B7E96' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center;
  }
  .ck-input:focus, .ck-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(242,153,74,0.16); background: #fff; }
  .ck-input::placeholder { color: #ABA79A; }
  .ck-error { font-size: 12px; color: #A6362C; min-height: 16px; padding: 0 2px; }
  .ck-submit-btn {
    width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    border: none; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 700;
    font-family: 'Inter', sans-serif; cursor: pointer; transition: opacity 0.18s, transform 0.12s;
    display: flex; align-items: center; justify-content: center; gap: 7px; -webkit-tap-highlight-color: transparent;
  }
  .ck-submit-btn:hover { opacity: 0.92; }
  .ck-submit-btn:active { transform: scale(0.98); }
  .ck-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .ck-submit-btn .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
  .ck-submit-btn.loading .spinner { display: block; }
  .ck-submit-btn.loading .btn-label { opacity: 0.7; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ck-divider { height: 1px; background: #F0ECDF; margin: 14px 14px 0; }
  .ck-footer { text-align: center; padding: 10px 14px 14px; font-size: 10px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; }
  .ck-footer svg { width: 11px; height: 11px; opacity: 0.6; }

  .success-bub { background: #EAF4E9; border: 1.5px solid #9AC694; border-radius: 18px; border-top-left-radius: 4px; padding: 14px 16px; max-width: 85%; }
  .success-title { font-size: 15px; font-weight: 700; color: #2E6B2A; margin-bottom: 5px; }
  .success-msg { font-size: 13px; color: #2C4A28; line-height: 1.6; }
  .success-ref { margin-top: 8px; font-size: 11px; color: #3E8A38; font-weight: 600; }

  .inp-area { padding: 10px 14px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #ECE8DE; background: #fff; flex-shrink: 0; position: relative; z-index: 2; }
  .inp-row {
    display: flex; align-items: center; gap: 8px; background: #F2EFE6; border: 1.5px solid transparent;
    border-radius: 26px; padding: 9px 10px 9px 16px; transition: border-color 0.2s, background 0.2s;
  }
  .inp-row:focus-within { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(242,153,74,0.14); }
  .inp-icon-btn {
    background: none; border: none; cursor: pointer; color: var(--muted); padding: 2px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; transition: color 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .inp-icon-btn:hover { color: var(--ink); }
  .inp-icon-btn svg { width: 18px; height: 18px; }
  .inp-row input {
    flex: 1; background: none; border: none; outline: none; color: var(--ink);
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 400; caret-color: var(--accent); min-width: 0;
  }
  .inp-row input::placeholder { color: #ABA79A; }
  .send-btn {

<body>

  <!-- ═══════════════════════════════════════════

          </svg>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>

        <input type="text" id="inp" placeholder="Ask about a trip…" onkeydown="onKey(event)" autocomplete="off" autocorrect="off" autocapitalize="sentences" />

          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

  </div>

<script>
  /* ═══════════════════════════════════════════════════════════
     CONFIG
  ═══════════════════════════════════════════════════════════ */
  const CONFIG = {

        url: 'https://www.sunrisetours.co.uk/trips/durdle-door-lulworth-cove-jurassic-coast-day-trip'
      },
      {
        title: 'Cotswolds Escape — 3 Villages',
        from: 'From London',
        duration: '1 day',
        price: '48',
        image: 'https://www.sunrisetours.co.uk/images/hero.webp',
        description: 'Bibury, Bourton-on-the-Water and Stow-on-the-Wold in one relaxed day trip through the English countryside.',

  };

  document.documentElement.style.setProperty('--c1', CONFIG.primaryColor);
  document.documentElement.style.setProperty('--c2', CONFIG.secondaryColor);
  document.documentElement.style.setProperty('--accent', CONFIG.accentColor);
  document.documentElement.style.setProperty('--accent2', CONFIG.accent2Color);

  const SESSION_ID = 'trip_' + Math.random().toString(36).slice(2, 11) + '_' + Date.now();
  let isBusy = false;
  let lastUserMessage = '';
  let hasOpenedOnce = false;

  /* ═══ LAUNCHER TOGGLE — mirrors the Bot Yama widget's approach:
     two independent fixed elements, toggled via classList, with
     a real mobile body-scroll lock. ═══ */
  const launcherWrap = document.getElementById('launcherWrap');
  const launcherBtn = document.getElementById('launcherBtn');
  const livePill = document.getElementById('livePill');
  const chatContainer = document.getElementById('chatContainer');
  const closeBtn = document.getElementById('closeBtn');
  const launcherBadge = document.getElementById('launcherBadge');

  /* ═══ FIX: re-parent both fixed elements directly under <body>.
     position:fixed only anchors to the real viewport if NO ancestor
     has a transform/filter/perspective/will-change set. Many host
     pages (theme animations, page builders) wrap embedded snippets
     in a div that has one of those — which turns that div into the
     containing block instead of the viewport, making the widget
     appear to only cover part of the screen. Moving these nodes to
     be direct children of <body> sidesteps that entirely. ═══ */
  document.body.appendChild(launcherWrap);
  document.body.appendChild(chatContainer);

  function isMobile() { return window.innerWidth <= 480; }

  let savedScrollY = 0;
  function lockBodyScroll() {
    savedScrollY = window.scrollY || window.pageYOffset || 0;
    document.documentElement.classList.add('chat-open');
    document.body.classList.add('chat-open');
    document.body.style.top = `-${savedScrollY}px`;
  }
  function unlockBodyScroll() {
    document.documentElement.classList.remove('chat-open');
    document.body.classList.remove('chat-open');
    document.body.style.top = '';
    window.scrollTo(0, savedScrollY);
  }

  function openWidget() {
    chatContainer.classList.add('active');
    launcherWrap.classList.add('hidden');
    launcherBadge.style.display = 'none';
    if (!hasOpenedOnce) { hasOpenedOnce = true; renderOpening(); }
    if (isMobile()) lockBodyScroll();
    setTimeout(() => document.getElementById('inp')?.focus(), 240);
  }
  function closeWidget() {
    chatContainer.classList.remove('active');
    launcherWrap.classList.remove('hidden');
    if (isMobile()) unlockBodyScroll();
  }

  launcherBtn.addEventListener('click', (e) => { e.preventDefault(); openWidget(); });
  livePill.addEventListener('click', (e) => { e.preventDefault(); openWidget(); });
  closeBtn.addEventListener('click', (e) => { e.preventDefault(); closeWidget(); });

  window.addEventListener('resize', () => {
    if (!isMobile() && document.body.classList.contains('chat-open')) unlockBodyScroll();
  });

  chatContainer.addEventListener('touchmove', function (e) {
    const scrollable = e.target.closest('.msgs, .tour-scroll, .subhdr');
    if (!scrollable) e.preventDefault();
  }, { passive: false });

  /* ═══════════════════════════════════
     MARKDOWN PARSER
  ═══════════════════════════════════ */
  function parseMarkdown(raw) {
    let h = raw;
    h = h.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h = h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
    h = h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
    h = h.replace(/^# (.+)$/gm,'<h3>$1</h3>');
    h = h.replace(/^---+$/gm,'<hr>');
    h = h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
    h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    h = h.replace(/__(.+?)__/g,'<strong>$1</strong>');
    h = h.replace(/\*(.+?)\*/g,'<em>$1</em>');
    h = h.replace(/_(.+?)_/g,'<em>$1</em>');
    h = h.replace(/`(.+?)`/g,'<code>$1</code>');
    h = h.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/(?<!["\(>])(https?:\/\/[^\s<"'\)\]]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
    h = h.replace(/(<li>.*<\/li>\n?)+/g,(b)=>'<ul>'+b+'</ul>');
    h = h.replace(/^\d+\. (.+)$/gm,'<oli>$1</oli>');
    h = h.replace(/(<oli>.*<\/oli>\n?)+/g,(b)=>'<ol>'+b.replace(/<\/?oli>/g,t=>t==='<oli>'?'<li>':'</li>')+'</ol>');
    h = h.replace(/\n{2,}/g,'\n\n');
    h = h.split('\n\n').map(l=>{
      const t=l.trim();
      if(!t) return '';
      if(/^<(h[1-3]|ul|ol|blockquote|hr|li)/.test(t)) return t;
      return '<p>'+t.replace(/\n/g,'<br>')+'</p>';
    }).filter(Boolean).join('\n');
    return h;
  }

  /* ═══════════════════════════════════
     UTILITIES
  ═══════════════════════════════════ */
  function scrollB() { const el = document.getElementById('msgs'); setTimeout(()=>{ el.scrollTop = el.scrollHeight; }, 40); }
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function getTime() { return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
  function setBusy(state) {
    isBusy = state;
    document.getElementById('send-btn').disabled = state;
    document.getElementById('inp').disabled = state;
    document.querySelectorAll('.opt-pill').forEach(b => b.disabled = state);
  }
  function removeOptions(id) { document.getElementById(id)?.remove(); }

  function agentRowHTML() {
    return `
      <div class="agent-row">
        <div class="agent-row-av">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 3v2M12 19v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M3 12h2M19 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4"/>
          </svg>
        </div>
        <span class="agent-row-name">${escHtml(CONFIG.agentTag)}</span>
        <span class="agent-row-badge">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2a5 5 0 110 10A5 5 0 018 3zm-.75 2.5v3.25l2.5 1.5.75-1.25-2-1.2V5.5h-1.25z"/></svg>
          AI
        </span>
        <span class="agent-row-time">${getTime()}</span>
      </div>`;
  }

  /* ═══════════════════════════════════
     RENDER OPENING
  ═══════════════════════════════════ */
  function renderOpening() {
    document.getElementById('hdr-company-name').textContent = CONFIG.companyName;
    document.getElementById('hdr-agent-tag').textContent = CONFIG.agentTag;
    document.getElementById('inp-footer-text').textContent = CONFIG.footerText;

    const tb = document.getElementById('trust-bar');
    tb.innerHTML = CONFIG.trustBadges.map((b,i) => `<div class="sub-item${i===0?' star':''}">${escHtml(b)}</div>`).join('');

    const m = document.getElementById('msgs');

    const dp = document.createElement('div');
    dp.className = 'date-pill';
    dp.textContent = new Date().toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
    m.appendChild(dp);

    const grp = document.createElement('div');
    grp.className = 'msg-group';
    grp.id = 'opening-group';
    grp.innerHTML = `
      ${agentRowHTML()}
      <div class="msg">
        <div class="bub b">
          <p>Welcome aboard! ☀️ I'm your Sunrise Tours assistant. I can help you find a trip, check pickup points, or get you booked in.</p>
        </div>
      </div>
    `;
    m.appendChild(grp);

    const optsDiv = document.createElement('div');
    optsDiv.className = 'options-wrap';
    optsDiv.id = 'starter-options';
    CONFIG.starterOptions.forEach(label => {
      const btn = document.createElement('button');
      btn.className = 'opt-pill';
      btn.textContent = label;
      btn.onclick = () => { removeOptions('starter-options'); sendMessage(label); };
      optsDiv.appendChild(btn);
    });
    m.appendChild(optsDiv);
    scrollB();
  }

  /* ═══════════════════════════════════
     APPEND USER MESSAGE
  ═══════════════════════════════════ */
  function appendUser(txt) {
    const m = document.getElementById('msgs');
    const grp = document.createElement('div');
    grp.className = 'msg-group';
    grp.innerHTML = `
      <div style="display:flex;justify-content:flex-end;margin-bottom:4px;">
        <span style="font-size:10px;color:var(--muted);margin-right:4px;">${getTime()}</span>
      </div>
      <div class="msg u">
        <div class="u-av">You</div>
        <div class="bub u">${escHtml(txt)}</div>
      </div>`;
    m.appendChild(grp);
    scrollB();
  }

  function appendTyping() {
    const m = document.getElementById('msgs');
    const id = 'ty' + Date.now();
    const grp = document.createElement('div');
    grp.id = id; grp.className = 'msg-group';
    grp.innerHTML = `${agentRowHTML()}<div class="msg"><div class="tdots"><div class="d"></div><div class="d"></div><div class="d"></div></div></div>`;
    m.appendChild(grp);
    scrollB();
    return id;
  }

  function appendBot(rawContent, options) {
    const m = document.getElementById('msgs');
    const optId = 'opts_' + Date.now();
    const grp = document.createElement('div');
    grp.className = 'msg-group';
    grp.innerHTML = `${agentRowHTML()}<div class="msg"><div class="bub b">${parseMarkdown(rawContent)}</div></div>`;
    m.appendChild(grp);

    if (Array.isArray(options) && options.length > 0) {
      const optsDiv = document.createElement('div');
      optsDiv.className = 'options-wrap';
      optsDiv.id = optId;
      options.forEach(label => {
        const btn = document.createElement('button');
        btn.className = 'opt-pill';
        btn.textContent = label;
        btn.onclick = () => { removeOptions(optId); sendMessage(label); };
        optsDiv.appendChild(btn);
      });
      m.appendChild(optsDiv);
    }
    scrollB();
  }

  function appendError() {
    const m = document.getElementById('msgs');
    const grp = document.createElement('div');
    grp.className = 'msg-group';
    grp.innerHTML = `
      ${agentRowHTML()}
      <div class="msg">
        <div class="bub err">
          Sorry, there was a connection issue. Please try again.
          <br><button class="retry-btn" onclick="retry()">Retry</button>
        </div>
      </div>`;
    m.appendChild(grp);
    scrollB();
  }

  function retry() {
    if (!lastUserMessage || isBusy) return;
    document.querySelectorAll('.bub.err').forEach(e => e.closest('.msg-group')?.remove());
    sendMessage(lastUserMessage);
  }

  /* ═══════════════════════════════════
     TOUR CARDS
  ═══════════════════════════════════ */
  let tourRegistry = {};

  function appendTourCards(tours) {
    if (!Array.isArray(tours) || tours.length === 0) return;
    const m = document.getElementById('msgs');
    const grp = document.createElement('div');
    grp.className = 'msg-group';

    const cardsHtml = tours.map((t, i) => {
      const key = 't_' + Date.now() + '_' + i;
      tourRegistry[key] = t;

      const img = t.image
        ? `<img src="${escHtml(t.image)}" alt="${escHtml(t.title || 'Tour photo')}" onerror="this.closest('.tour-img-wrap').innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;color:#ABA79A;font-size:11px;\\'>No photo available</div>'"/>`
        : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ABA79A;font-size:11px;">No photo available</div>`;

      const price = t.price ? `${CONFIG.currency}${t.price}` : 'Enquire';
      const priceSuffix = t.price ? 'pp' : '';

      return `
        <div class="tour-card">
          <div class="tour-img-wrap">
            ${img}
            ${t.duration ? `<div class="tour-badge">${escHtml(t.duration)}</div>` : ''}
            ${t.from ? `<div class="tour-from-badge">${escHtml(t.from)}</div>` : ''}
          </div>
          <div class="tour-body">
            ${t.title ? `<div class="tour-title">${escHtml(t.title)}</div>` : ''}
            <div class="tour-price">${escHtml(price)}${priceSuffix ? `<span> ${escHtml(priceSuffix)}</span>` : ''}</div>
            <div class="tour-actions">
              <button class="tour-btn details" onclick="showTourDetails('${key}')">Details</button>
              <button class="tour-btn book" onclick="sendMessage('I want to book: ' + '${escHtml(t.title || 'this trip')}')">Book Now</button>
            </div>
          </div>
        </div>`;
    }).join('');

    grp.innerHTML = `${agentRowHTML()}<div class="tour-scroll">${cardsHtml}</div>`;
    m.appendChild(grp);
    scrollB();
  }

  function showTourDetails(key) {
    const t = tourRegistry[key];
    if (!t) return;
    document.getElementById('tour-modal-overlay')?.remove();

    const container = document.getElementById('chatContainer');
    const overlay = document.createElement('div');
    overlay.id = 'tour-modal-overlay';
    overlay.className = 'tour-modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) closeTourDetails(); };

    const price = t.price ? `${CONFIG.currency}${t.price}` : 'Enquire for price';
    const priceSuffix = t.price ? 'pp' : '';
    const img = t.image
      ? `<img class="tour-modal-img" src="${escHtml(t.image)}" alt="${escHtml(t.title || 'Tour photo')}" onerror="this.style.display='none'"/>`
      : `<div class="tour-modal-img" style="display:flex;align-items:center;justify-content:center;color:#ABA79A;font-size:12px;">No photo available</div>`;

    overlay.innerHTML = `
      <div class="tour-modal">
        <div class="tour-modal-img-wrap">
          ${img}
          <button class="tour-modal-close" onclick="closeTourDetails()" aria-label="Close">✕</button>
        </div>
        <div class="tour-modal-body">
          ${t.title ? `<div class="tour-modal-title">${escHtml(t.title)}</div>` : ''}
          ${t.description ? `<div class="tour-modal-desc">${escHtml(t.description)}</div>` : ''}
          <div class="tour-modal-price">${escHtml(price)}${priceSuffix ? `<span> ${escHtml(priceSuffix)}</span>` : ''}</div>
          <div class="tour-modal-meta">
            ${t.duration ? `<span>${escHtml(t.duration)}</span>` : ''}
            ${t.from ? `<span>${escHtml(t.from)}</span>` : ''}
          </div>
          <button class="tour-modal-book" onclick="closeTourDetails(); sendMessage('I want to book: ' + '${escHtml(t.title || 'this trip')}')">Book Now</button>
        </div>
      </div>`;

    container.appendChild(overlay);
  }

  function closeTourDetails() { document.getElementById('tour-modal-overlay')?.remove(); }

  /* ═══════════════════════════════════
     BOOKING CARD
  ═══════════════════════════════════ */
  function appendBookingCard(tripName) {
    document.getElementById('booking-card')?.remove();
    const m = document.getElementById('msgs');

    const grp = document.createElement('div');
    grp.id = 'booking-card'; grp.className = 'msg-group';
    grp.innerHTML = `
      ${agentRowHTML()}
      <div class="card-wrap">
        <div class="card">
          <div class="card-hdr">
            <div class="card-hdr-title">Book Your Trip</div>
            <div class="card-hdr-sub">${tripName ? escHtml(tripName) : "We'll confirm availability by email"}</div>
          </div>
          <div class="card-fields">
            <input class="ck-input" type="text" id="bk-name" placeholder="Full Name" autocomplete="name"/>
            <input class="ck-input" type="email" id="bk-email" placeholder="Email Address" autocomplete="email"/>
            <input class="ck-input" type="tel" id="bk-phone" placeholder="Phone Number" autocomplete="tel"/>
            <select class="ck-select" id="bk-travellers">
              <option value="" disabled selected>Number of Travellers</option>
              <option>1</option><option>2</option><option>3</option><option>4</option><option>5+</option>
            </select>
            <select class="ck-select" id="bk-pickup">
              <option value="" disabled selected>Pickup Point</option>
              <option>Ilford, London</option>
              <option>Elephant & Castle, London</option>
              <option>Notting Hill Gate, London</option>
              <option>Southall, London</option>
              <option>Small Heath, Birmingham</option>
              <option>Fallowfield, Manchester</option>
            </select>
            <div id="bk-error" class="ck-error"></div>
          </div>
          <div class="ck-divider"></div>
          <div style="padding:14px 14px 0;">
            <button class="ck-submit-btn" id="bk-submit-btn" onclick="handleBookingSubmit('${escHtml(tripName || '')}')">
              <div class="spinner"></div>
              <span class="btn-label">Confirm Booking Request</span>
            </button>
          </div>
          <div class="ck-footer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Your details are sent securely to our booking team
          </div>
        </div>
      </div>`;
    m.appendChild(grp);
    scrollB();
  }

  async function handleBookingSubmit(tripName) {
    const name = document.getElementById('bk-name')?.value.trim();
    const email = document.getElementById('bk-email')?.value.trim();
    const phone = document.getElementById('bk-phone')?.value.trim();
    const travellers = document.getElementById('bk-travellers')?.value;
    const pickup = document.getElementById('bk-pickup')?.value;
    const errEl = document.getElementById('bk-error');

    if (!name) { errEl.textContent = 'Please enter your full name.'; return; }
    if (!email || !email.includes('@')) { errEl.textContent = 'Please enter a valid email address.'; return; }
    if (!phone) { errEl.textContent = 'Please enter a contact phone number.'; return; }
    if (!travellers) { errEl.textContent = 'Please select the number of travellers.'; return; }
    if (!pickup) { errEl.textContent = 'Please select a pickup point.'; return; }
    errEl.textContent = '';

    const btn = document.getElementById('bk-submit-btn');
    btn.disabled = true; btn.classList.add('loading');

    try {
      const res = await fetch(CONFIG.webhookUrl, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'submit_booking', trip: tripName, name, email, phone,
          travellers, pickup, sessionId: SESSION_ID
        })
      });
      if (!res.ok) throw new Error('Could not send your booking request. Please try again.');
      const data = await res.json().catch(() => ({}));
      document.getElementById('booking-card')?.remove();
      appendBookingSuccess(name, email, tripName, data.reference);
    } catch (err) {
      errEl.textContent = err.message || 'Something went wrong. Please try again.';
      btn.disabled = false; btn.classList.remove('loading');
    }
  }

  function appendBookingSuccess(name, email, tripName, reference) {
    const m = document.getElementById('msgs');
    const firstName = name.split(' ')[0];
    const refShort = reference ? String(reference).slice(-8).toUpperCase() : Math.random().toString(36).slice(2, 8).toUpperCase();
    const grp = document.createElement('div');
    grp.className = 'msg-group';
    grp.innerHTML = `
      ${agentRowHTML()}
      <div class="msg">
        <div class="success-bub">
          <div class="success-title">Booking Request Sent, ${escHtml(firstName)}!</div>
          <div class="success-msg">
            We've received your request${tripName ? ` for <strong>${escHtml(tripName)}</strong>` : ''}.
            Our team will confirm availability and send payment details to <strong>${escHtml(email)}</strong> shortly.
          </div>
          <div class="success-ref">Ref: #${refShort}</div>
        </div>
      </div>`;
    m.appendChild(grp);
    scrollB();
  }

  /* ═══════════════════════════════════
     SEND LOGIC
  ═══════════════════════════════════ */
  function onKey(e) { if (e.key === 'Enter' && !isBusy) send(); }

  function send() {
    const inp = document.getElementById('inp');
    const txt = inp.value.trim();
    if (!txt || isBusy) return;
    inp.value = ''; inp.focus();
    sendMessage(txt);
  }

  async function sendMessage(txt) {
    if (isBusy) return;
    lastUserMessage = txt;
    setBusy(true);
    appendUser(txt);
    const tid = appendTyping();
    scrollB();

    try {
      const res = await fetch(CONFIG.webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: txt, source: 'sunrise_tours_widget', sessionId: SESSION_ID, action: 'chat' })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      document.getElementById(tid)?.remove();

      const reply =
        data.message || data.reply || data.output || data.text ||
        "Thanks for reaching out — I've got your message.";

      const strippedReply = reply
        .replace(/\[show_tours\]/gi, '')
        .replace(/\[show_booking\]/gi, '')
        .trim();

      appendBot(strippedReply, data.buttons);

      const wantsTours = data.action === 'show_tours' || /\[show_tours\]/i.test(reply);
      const wantsBooking = data.action === 'show_booking' || /\[show_booking\]/i.test(reply) || /^i want to book:/i.test(txt);

      const toursToShow = Array.isArray(data.tours) && data.tours.length > 0
        ? data.tours
        : (wantsTours ? CONFIG.demoTours : null);

      if (toursToShow) setTimeout(() => appendTourCards(toursToShow), 700);
      if (wantsBooking) setTimeout(() => appendBookingCard(txt.replace(/^i want to book:\s*/i, '')), 700);

    } catch (err) {
      document.getElementById(tid)?.remove();
      appendError();
    } finally {
      setBusy(false);
      document.getElementById('inp').focus();
    }
  }
</script>
</body>
